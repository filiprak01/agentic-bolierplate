name: Docs Pages

on:
  pull_request:
    paths:
      - "docs/**"
      - "src/agentic_boilerplate/domain/docs_site.py"
      - "src/agentic_boilerplate/cli.py"
      - ".github/workflows/docs-pages.yml"
  push:
    branches:
      - main
      - "release/**"
    tags:
      - "v*"
    paths:
      - "docs/**"
      - "src/agentic_boilerplate/domain/docs_site.py"
      - "src/agentic_boilerplate/cli.py"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Set to true to deploy to GitHub Pages when repository Pages settings are configured."
        required: false
        default: "false"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate docs links
        run: PYTHONPATH=src python -m agentic_boilerplate.cli docs-site validate --docs-root docs
      - name: Build docs site
        run: PYTHONPATH=src python -m agentic_boilerplate.cli docs-site build --docs-root docs --output-root site
      - name: Upload dry-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site

  deploy:
    name: Deploy docs site
    needs: validate
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request' &&
      (vars.AGENTIC_DOCS_PUBLISH_ENABLED == 'true' || github.event.inputs.publish == 'true') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs site
        run: PYTHONPATH=src python -m agentic_boilerplate.cli docs-site build --docs-root docs --output-root site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
